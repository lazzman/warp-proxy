<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>warp-proxy</title>
<link rel="stylesheet" href="/assets/bootstrap.min.css">
<style>
  :root, [data-bs-theme="light"] {
    --paper: #f3f4f2;
    --panel: #ffffff;
    --hair: rgba(24, 26, 23, .14);
    --ink: #1a1c19;
    --accent: #1d3c31;
    --alert-wash: #fbf7f2;
  }
  [data-bs-theme="dark"] {
    --paper: #111210;
    --panel: #181a17;
    --hair: rgba(236, 237, 230, .16);
    --ink: #eceee8;
    --accent: #e7ebe4;
    --alert-wash: #241f18;
  }
  body { background: var(--paper); color: var(--ink); font-weight: 400; }
  .navbar { min-height: 52px; background: var(--panel) !important; border-bottom-color: var(--hair) !important; }
  .navbar-brand { font-weight: 600; letter-spacing: -.01em; }
  #views .nav-link { border-radius: 8px; color: var(--bs-secondary-color); padding: 6px 10px; }
  #views .nav-link.active { color: var(--ink); background: var(--bs-tertiary-bg); }
  #online { font-size: 13px; color: var(--bs-secondary-color); }
  main.container-fluid { padding: 24px 28px 48px; }
  .lamp { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--bs-secondary-color); flex: none; }
  .lamp.on, .lamp.healthy { background: #2f7d57; }
  .lamp.attention, .lamp.waiting, .lamp.down, .lamp.connecting, .lamp.retrying { background: #b86a1a; }
  .lamp.maintenance, .lamp.disabled { background: #a3453c; }
  .btn, .form-control, .form-select { border-radius: 8px; }
  .form-control, .form-select { border-color: var(--hair); }
  .btn { font-weight: 500; }
  .btn-sm { padding: 4px 10px; }
  .btn-primary {
    --bs-btn-bg: var(--accent);
    --bs-btn-border-color: var(--accent);
    --bs-btn-hover-bg: #163028;
    --bs-btn-hover-border-color: #163028;
    --bs-btn-active-bg: #12261f;
    --bs-btn-active-border-color: #12261f;
    --bs-btn-color: #f4f6f2;
    --bs-btn-hover-color: #f4f6f2;
    --bs-btn-active-color: #f4f6f2;
  }
  [data-bs-theme="dark"] .btn-primary {
    --bs-btn-bg: #e7ebe4;
    --bs-btn-border-color: #e7ebe4;
    --bs-btn-color: #161815;
    --bs-btn-hover-bg: #f4f6f2;
    --bs-btn-hover-border-color: #f4f6f2;
    --bs-btn-hover-color: #161815;
    --bs-btn-active-bg: #d5dbd2;
    --bs-btn-active-border-color: #d5dbd2;
    --bs-btn-active-color: #161815;
  }
  .btn-outline-secondary {
    --bs-btn-color: var(--ink);
    --bs-btn-border-color: var(--hair);
    --bs-btn-hover-bg: var(--bs-tertiary-bg);
    --bs-btn-hover-color: var(--ink);
    --bs-btn-hover-border-color: var(--hair);
    --bs-btn-active-bg: var(--bs-tertiary-bg);
    --bs-btn-active-color: var(--ink);
    --bs-btn-active-border-color: var(--hair);
  }
  .btn-outline-danger {
    --bs-btn-color: #8a3b32;
    --bs-btn-border-color: #e4d2ce;
    --bs-btn-hover-bg: #f8f1ef;
    --bs-btn-hover-color: #8a3b32;
    --bs-btn-hover-border-color: #e4d2ce;
  }
  [data-bs-theme="dark"] .btn-outline-danger {
    --bs-btn-color: #e7b2aa;
    --bs-btn-border-color: #5a3330;
    --bs-btn-hover-bg: #2a1c1a;
    --bs-btn-hover-color: #e7b2aa;
    --bs-btn-hover-border-color: #5a3330;
  }
  .btn.is-on { background: #1c1e1b; color: #f4f5f2; border-color: #1c1e1b; }
  [data-bs-theme="dark"] .btn.is-on { background: #ecece6; color: #171816; border-color: #ecece6; }
  .card { border-radius: 12px; border-color: var(--hair); background: var(--panel); box-shadow: none; }
  .card-body { padding: 20px; }
  .card h2 { font-size: 15px; font-weight: 600; }
  #overview > h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  #overview > p { font-size: 13px; margin-bottom: 16px; }
  .stat .card-body { padding: 16px 18px 14px; }
  .stat .fs-3 { font-size: 28px; line-height: 1.15; letter-spacing: -.03em; margin: 6px 0 4px; }
  .figure, .num, .v { font-variant-numeric: tabular-nums; font-weight: 500; }
  .cluster { display: flex; flex-direction: column; gap: 8px; min-width: min(100%, 280px); padding: 12px 14px; border: 1px solid var(--hair); border-radius: 10px; background: var(--paper); }
  .cluster-label { font-size: 12px; color: var(--bs-secondary-color); }
  .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; }
  .metric { padding: 0 20px 0 0; }
  .metric + .metric { padding-left: 20px; border-left: 1px solid var(--hair); }
  .metric .k, .metric .s { font-size: 12px; color: var(--bs-secondary-color); }
  .metric .v { font-size: 18px; line-height: 1.4; margin-top: 4px; overflow-wrap: anywhere; }
  .metric .s { margin-top: 4px; }
  .sheet { border: 1px solid var(--hair); border-radius: 12px; background: var(--panel); overflow: auto; }
  .connections-scroll { max-height: 36rem; }
  .connections-scroll thead th { position: sticky; top: 0; z-index: 1; }
  .data-table { font-size: 13px; }
  .data-table th { font-size: 12px; font-weight: 500; color: var(--bs-secondary-color); }
  .data-table td, .data-table th { padding: 8px 10px; border-color: var(--hair); }
  .data-table thead th { background: var(--paper); }
  .table-hover > tbody > tr:hover > * { background: rgba(24, 26, 23, .03); }
  [data-bs-theme="dark"] .table-hover > tbody > tr:hover > * { background: rgba(236, 237, 230, .04); }
  .instance-table th, .instance-table td { white-space: nowrap; vertical-align: middle; }
  .instance-table th { text-align: start; }
  .instance-table .col-tight { width: 1%; }
  .instance-table .font-monospace, .data-table .font-monospace { font-size: 12px; }
  tr.row-alert td { background: var(--alert-wash); }
  .table-hover > tbody > tr.row-alert:hover > * { background: #f6f0e8; }
  [data-bs-theme="dark"] .table-hover > tbody > tr.row-alert:hover > * { background: #2c261e; }
  .status-cell { display: flex; align-items: center; gap: 8px; }
  .probe { color: var(--bs-secondary-color); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .clip { max-width: 168px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip-wide { max-width: 220px; }
  .row-actions .btn { padding: 2px 8px; }
  .log {
    max-height: 36rem;
    margin: 0;
    padding: 16px 18px;
    border: 0;
    border-radius: 12px;
    background: #121411;
    color: #d7d8d4;
    font-size: 12.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .log .t { color: #8d8f89; }
  .log .tag { color: #c8c9c3; }
  .log .sep { color: #6e706a; }
  .log .ok { color: #8fbf9f; }
  .log .bad { color: #d7a08a; }
  :focus-visible { outline: 2px solid #2f7d57; outline-offset: 2px; }
  #token { width: 160px; }
  @media (max-width: 768px) {
    main.container-fluid { padding: 16px 16px 32px; }
    .metrics { grid-template-columns: 1fr; gap: 12px; }
    .metric + .metric { padding-left: 0; border-left: 0; padding-top: 12px; border-top: 1px solid var(--hair); }
  }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
  <div class="container-fluid gap-3">
    <span class="navbar-brand mb-0 h1 fs-6 d-inline-flex align-items-center gap-2"><i class="lamp" id="lamp"></i>warp-proxy</span>
    <ul class="nav flex-row flex-nowrap" id="views">
      <li class="nav-item"><button type="button" class="nav-link active" data-view="overview">总览</button></li>
      <li class="nav-item"><button type="button" class="nav-link" data-view="instances">实例</button></li>
      <li class="nav-item"><button type="button" class="nav-link" data-view="connections">连接</button></li>
      <li class="nav-item"><button type="button" class="nav-link" data-view="logs">日志</button></li>
    </ul>
    <div class="ms-lg-auto d-flex flex-wrap align-items-center gap-2">
      <form class="d-flex align-items-center gap-2" id="login">
        <input id="token" class="form-control form-control-sm" type="password" placeholder="管理密码" autocomplete="current-password" aria-label="管理密码">
        <button class="btn btn-primary btn-sm" type="submit">连接</button>
      </form>
      <span id="online">控制面离线</span>
      <select id="refresh" class="form-select form-select-sm" style="width: 7rem" aria-label="自动刷新">
        <option value="1">1 秒</option>
        <option value="3">3 秒</option>
        <option value="5" selected>5 秒</option>
        <option value="10">10 秒</option>
        <option value="30">30 秒</option>
      </select>
    </div>
  </div>
</nav>
<main class="container-fluid py-3">
  <div class="alert alert-danger d-none" id="error" role="alert"></div>
  <section id="overview">
    <h1 class="h4">还没有状态</h1>
    <p class="text-body-secondary mb-0">在顶栏输入管理密码并连接。连接后这里显示入口、流量和自动重启队列。</p>
  </section>
  <section id="instances" class="d-none"></section>
  <section id="connections" class="d-none"></section>
  <section id="logs" class="d-none"></section>
</main>
<script src="/assets/bootstrap.bundle.min.js"></script>
<script>
const state = { view: "overview", filter: "all", logKind: "all", status: null, sessions: [], logs: null, stick: true, timer: 0, temps: [], focusId: "", drafts: {}, restartDraft: null, busy: false, tempCount: "1" };
const tokenInput = document.querySelector("#token");
function readCachedToken() {
  try {
    const saved = localStorage.getItem("warp-token");
    if (saved) return saved;
    const legacy = sessionStorage.getItem("warp-token") || "";
    if (legacy) localStorage.setItem("warp-token", legacy);
    return legacy;
  } catch (_) {
    return "";
  }
}
function writeCachedToken(token) {
  try {
    if (token) localStorage.setItem("warp-token", token);
    else localStorage.removeItem("warp-token");
    sessionStorage.removeItem("warp-token");
  } catch (_) {}
}
state.token = readCachedToken().trim();
tokenInput.value = state.token;
const theme = () => document.documentElement.setAttribute("data-bs-theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
theme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", theme);

document.querySelectorAll("#views button").forEach((button) => {
  button.addEventListener("click", () => {
    state.view = button.dataset.view;
    document.querySelectorAll("#views button").forEach((item) => item.classList.toggle("active", item === button));
    for (const id of ["overview", "instances", "connections", "logs"]) {
      document.querySelector("#" + id).classList.toggle("d-none", id !== state.view);
    }
    refresh();
  });
});
document.querySelector("#login").addEventListener("submit", (event) => {
  event.preventDefault();
  state.token = tokenInput.value.trim();
  if (!state.token) writeCachedToken("");
  refresh();
});
document.querySelector("#refresh").addEventListener("change", schedule);

function schedule() {
  clearTimeout(state.timer);
  let seconds = Number(document.querySelector("#refresh").value);
  if (state.status && state.status.tasks && state.status.tasks.length) seconds = Math.min(seconds, 1);
  state.timer = setTimeout(refresh, seconds * 1000);
}
async function api(path) {
  const token = (state.token || "").trim();
  const response = await fetch(path, { headers: token ? { "X-Warp-Token": token } : {}, cache: "no-store" });
  const text = await response.text();
  if (!response.ok) throw new Error(text || response.statusText);
  return text ? JSON.parse(text) : {};
}
function showError(message) {
  const error = document.querySelector("#error");
  error.textContent = message || "";
  error.classList.toggle("d-none", !message);
}
function feedbackKey(name, button) {
  if (button && button.dataset.slot && (name === "restart" || name === "manual")) return "slot:" + button.dataset.slot;
  return "act:" + name;
}
function rowStatus(account) {
  const live = state.feedback && state.feedback.key === "slot:" + account.id ? state.feedback : null;
  if (!live) return escapeHtml(account.last_action || "—");
  const tone = live.error ? "text-danger" : "text-primary";
  return '<span class="' + tone + '" title="' + escapeHtml(live.text) + '">' + escapeHtml(live.text) + "</span>";
}
let feedbackTimer = 0;
let refreshSeq = 0;
function scheduleFeedbackClear() {
  clearTimeout(feedbackTimer);
  feedbackTimer = setTimeout(() => {
    feedbackTimer = 0;
    state.feedback = null;
    if (!state.busy) render();
  }, 1200);
}
function applyFeedback() {
  const live = state.feedback;
  if (!live || String(live.key).indexOf("act:") !== 0) return;
  const name = live.key.slice(4);
  document.querySelectorAll('[data-act="' + name + '"]').forEach((button) => {
    if (!button.dataset.label) button.dataset.label = button.textContent;
    button.textContent = live.error ? "失败" : live.text;
    button.title = live.text;
  });
}
function actionText(name, button) {
  const slot = button && button.dataset.slot;
  if (name === "restart") return slot ? "重连实例 " + slot : "重连";
  if (name === "manual") return (button.dataset.on === "1" ? "启用" : "停用") + (slot ? "实例 " + slot : "");
  if (name === "rotate") return "换出口";
  if (name === "trace") return "检测出口 IP";
  if (name === "graceful-restart") return "触发全部实例优雅重启";
  if (name === "restart-policy") return "更新重启策略";
  if (name === "add-temp") {
    const count = Math.max(1, Math.min(100, Number(state.tempCount) || 1));
    return count > 1 ? "添加 " + count + " 个临时实例" : "添加临时实例";
  }
  if (name === "remove-temp") return "移除临时实例";
  if (name === "toggle") return button.dataset.on === "1" ? "恢复入口" : "暂停入口";
  if (name === "http2") return button.dataset.on === "1" ? "切换到 HTTP/2" : "切换到 HTTP/3";
  if (name === "interval") return "设置换出口间隔";
  return ((button && button.textContent) || "操作").trim();
}
function setBusy(on) {
  state.busy = on;
  document.querySelectorAll("[data-act]").forEach((item) => { item.disabled = on; });
}
async function refresh() {
  const seq = ++refreshSeq;
  try {
    const status = await api("/api/status");
    if (seq !== refreshSeq) return;
    state.status = status;
    if (state.view === "connections") {
      const page = await api("/api/sessions");
      if (seq !== refreshSeq) return;
      state.sessions = page.sessions || page || [];
    }
    if (state.view === "logs") {
      const logs = await api("/api/logs");
      if (seq !== refreshSeq) return;
      state.logs = logs;
    }
    writeCachedToken(state.token);
    showError("");
    const online = document.querySelector("#online");
    online.textContent = status.initializing ? "正在准备账号" : "控制面在线";
    document.querySelector("#lamp").className = "lamp on";
    render();
  } catch (err) {
    if (seq !== refreshSeq) return;
    const online = document.querySelector("#online");
    online.textContent = "控制面离线";
    document.querySelector("#lamp").className = "lamp";
    showError(String(err.message || err).replace(/^Error: /, ""));
  }
  if (seq === refreshSeq) schedule();
}
function capture() {
  state.temps = [...document.querySelectorAll("[data-temp]:checked")].map((item) => item.dataset.temp);
  const active = document.activeElement;
  const tempCount = document.getElementById("temp-count");
  if (tempCount) state.tempCount = tempCount.value;
  state.focusId = active && ["rotate-seconds", "temp-count", "restart-uptime", "restart-users", "restart-connections"].includes(active.id) ? active.id : "";
  for (const id of ["rotate-seconds"]) {
    const node = document.getElementById(id);
    if (node && active === node) state.drafts[id] = node.value;
    else delete state.drafts[id];
  }
}
function render() {
  const data = state.status;
  if (!data) return;
  capture();
  if (state.view === "overview") document.querySelector("#overview").innerHTML = overview(data);
  if (state.view === "instances") document.querySelector("#instances").innerHTML = instances(data);
  if (state.view === "connections") {
    const panel = document.querySelector("#connections");
    const previous = panel.querySelector(".connections-scroll");
    const scrollTop = previous ? previous.scrollTop : 0;
    const scrollLeft = previous ? previous.scrollLeft : 0;
    const anchor = previous && scrollTop > 0 ? [...previous.querySelectorAll("tbody tr")].find((row) => row.getBoundingClientRect().bottom > previous.getBoundingClientRect().top) : null;
    const anchorId = anchor && anchor.dataset.session;
    const anchorOffset = anchor ? anchor.getBoundingClientRect().top - previous.getBoundingClientRect().top : 0;
    panel.innerHTML = connections();
    const next = panel.querySelector(".connections-scroll");
    if (next) {
      next.scrollTop = scrollTop;
      next.scrollLeft = scrollLeft;
      if (anchorId) {
        const row = [...next.querySelectorAll("tbody tr")].find((item) => item.dataset.session === anchorId);
        if (row) next.scrollTop += row.getBoundingClientRect().top - next.getBoundingClientRect().top - anchorOffset;
      }
    }
  }
  if (state.view === "logs") {
    const box = document.querySelector("#logs pre");
    const atBottom = !box || box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    document.querySelector("#logs").innerHTML = logs();
    const next = document.querySelector("#logs pre");
    if (next && (state.stick || atBottom)) next.scrollTop = next.scrollHeight;
  }
  if (state.focusId) {
    const node = document.getElementById(state.focusId);
    if (node) node.focus();
  }
  bind();
}
function overview(data) {
  const total = data.accounts.length;
  const bad = data.attention + data.unknown;
  const connecting = data.accounts.some((item) => item.health === "connecting" || item.health === "retrying");
  const title = data.initializing
    ? "正在准备账号（" + total + "/" + data.expected_accounts + "）"
    : connecting ? "正在连接实例（已就绪 " + data.ready + "/" + total + "）"
    : data.ready === total && total > 0 ? "全部实例运行正常"
    : bad ? bad + " 个实例需要关注" : "没有可调度的实例";
  const mode = data.mixed ? "MIXED" : "SOCKS5";
  const rotateValue = state.drafts["rotate-seconds"] != null ? state.drafts["rotate-seconds"] : data.rotate_seconds;
  const draft = state.restartDraft || {};
  const uptime = draft.uptime ?? String(data.restart_max_uptime_seconds);
  const users = draft.users ?? String(data.restart_max_users);
  const connections = draft.connections ?? String(data.restart_max_connections);
  const triggers = [
    data.restart_max_uptime_seconds > 0 ? "运行 " + duration(data.restart_max_uptime_seconds) : null,
    data.restart_max_users > 0 ? "用户 " + data.restart_max_users : null,
    data.restart_max_connections > 0 ? "连接 " + data.restart_max_connections : null,
  ].filter(Boolean);
  const drains = data.drain_queue || [];
  const restarts = data.restart_queue || [];
  return `
    <h1 class="h4 mb-1">${escapeHtml(title)}</h1>
    <p class="text-body-secondary">${escapeHtml(data.listen || "未绑定")} · ${mode} · ${escapeHtml(data.strategy)} · ${escapeHtml(data.sticky)} · 统计自 ${clock(data.started_at)}</p>
    <div class="row g-3">
      ${stat("可用实例", data.ready + "/" + total, "关注 " + data.attention + " · 维护 " + data.maintenance + " · 未知 " + data.unknown)}
      ${stat("活跃连接", data.active_connections, "只统计还没关闭的转发")}
      ${stat("累计上行", bytes(data.bytes_up), "含当前连接")}
      ${stat("累计下行", bytes(data.bytes_down), "含当前连接")}
    </div>
    <div class="card mt-3"><div class="card-body">
      <div class="d-flex flex-wrap justify-content-between align-items-baseline gap-2">
        <h2 class="h5 mb-0">调度</h2>
        <div class="text-body-secondary small">${data.enabled ? "入口开启" : "入口已暂停"} · ${data.http2 ? "HTTP/2" : "HTTP/3"} · 按负载策略自动选路</div>
      </div>
      <div class="d-flex flex-wrap gap-3 mt-3">
        <div class="cluster"><div class="cluster-label">入口</div><div class="d-flex flex-wrap align-items-center gap-2">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-act="toggle" data-on="${data.enabled ? "0" : "1"}">${data.enabled ? "暂停入口" : "恢复入口"}</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-act="http2" data-on="${data.http2 ? "0" : "1"}">${data.http2 ? "改用 HTTP/3" : "改用 HTTP/2"}</button>
        </div></div>
        <div class="cluster"><div class="cluster-label">出口</div><div class="d-flex flex-wrap align-items-center gap-2">
          <label class="d-flex align-items-center gap-2 mb-0">换出口 <input id="rotate-seconds" class="form-control form-control-sm" inputmode="numeric" value="${escapeHtml(rotateValue)}" style="width:5rem"> 秒</label>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-act="interval">设置</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-act="rotate">立即换出口（首实例）</button>
          <span class="text-body-secondary small">换出口会重新注册身份，独立于自动排空。</span>
        </div></div>
        <div class="cluster"><div class="cluster-label">实例维护</div><div class="d-flex flex-wrap align-items-center gap-2">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-act="graceful-restart" title="全部实例等待活跃连接结束后按并发限制重启">立即触发重启（全部实例）</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-act="trace">检测出口 IP</button>
          <span class="text-body-secondary small">全部实例会停止接入新连接，排空期间新连接可能失败。</span>
        </div></div>
      </div>
    </div></div>
    <div class="card mt-3"><div class="card-body">
      <h2 class="h5">自动重启 · 条件可组合</h2>
      <p class="text-body-secondary small">任意一个条件达到即刻摘流，已建立的连接自然结束；0 表示关闭该条件，全部为 0 时取消尚未开始的自动排空与待重启任务并重置该轮统计（已执行的重连仍会继续）。成功重连并确认 WARP 后清零统计。</p>
      <div class="d-flex flex-wrap align-items-center gap-2 mt-3">
        <label class="d-flex align-items-center gap-2 mb-0">运行超过 <input id="restart-uptime" class="form-control form-control-sm" type="number" min="0" step="1" value="${escapeHtml(uptime)}" style="width:7rem"> 秒</label>
        <label class="d-flex align-items-center gap-2 mb-0">累计用户 <input id="restart-users" class="form-control form-control-sm" type="number" min="0" step="1" value="${escapeHtml(users)}" style="width:7rem"></label>
        <label class="d-flex align-items-center gap-2 mb-0">累计连接 <input id="restart-connections" class="form-control form-control-sm" type="number" min="0" step="1" value="${escapeHtml(connections)}" style="width:8rem"></label>
        <button type="button" class="btn btn-outline-secondary btn-sm" data-act="restart-policy">应用条件</button>
      </div>
      <div class="metrics">
        <div class="metric"><div class="k">触发条件（任意满足）</div><div class="v">${triggers.length ? triggers.join(" / ") : "全部关闭"}</div><div class="s">三个阈值独立，所有统计按实例分别计算</div></div>
        <div class="metric"><div class="k">排空队列 · ${drains.length}</div><div class="v">${idList(drains)}</div><div class="s">每 ${data.restart_drain_check_seconds} 秒检测；有活跃连接继续等待，不设超时</div></div>
        <div class="metric"><div class="k">重启队列 · ${restarts.length}</div><div class="v">${idList(restarts)}</div><div class="s">同时最多重连 ${data.restart_concurrency} 个实例；无活跃连接才进入队列</div></div>
      </div>
      <p class="text-body-secondary small mt-3 mb-0">排空后新请求只选择其他可用实例：username-round / username-least 会保存新绑定、不自动迁回；username-hash / ip-hash 无状态，原实例恢复后可能重新选中。所有实例都不可用时才拒绝新连接。实例页“强制重连”可中断已有连接。</p>
    </div></div>
    <div class="card mt-3"><div class="card-body"><h2 class="h5">进行中的任务</h2>${tasks(data.tasks)}</div></div>`;
}
function stat(label, value, note) {
  return `<div class="col-6 col-lg-3"><div class="card stat h-100"><div class="card-body"><div class="text-body-secondary small">${label}</div><div class="fs-3 num">${value}</div><div class="text-body-secondary small">${note || ""}</div></div></div></div>`;
}
function idList(rows) {
  return rows && rows.length ? rows.join("、") : "无";
}
function interfaceV4(account) {
  return account.ip && account.ip !== "0.0.0.0" ? account.ip : "未分配";
}
function interfaceV6(account) {
  return account.assigned_v6 || "未分配";
}
function egressCell(ip, iface) {
  const shown = ip || "未测到";
  const title = "出口 " + shown + " · 接口 " + iface;
  return '<td class="font-monospace clip clip-wide" title="' + escapeHtml(title) + '">' + escapeHtml(shown) + "</td>";
}
function placeText(account) {
  const place = [account.country, account.colo].filter(Boolean).join(" · ");
  return place || "还没探测";
}
function tasks(rows) {
  if (!rows || !rows.length) return `<p class="text-body-secondary mb-0">没有进行中的任务。完成后会从这里消失</p>`;
  return `<div class="table-responsive"><table class="table table-sm align-middle mb-0 data-table"><thead><tr><th>实例</th><th>阶段</th><th class="text-end">剩余连接</th><th class="text-end">已耗时</th></tr></thead><tbody>${rows.map((row) => `<tr><td class="font-monospace">${row.id}</td><td>${escapeHtml(row.stage)}</td><td class="text-end font-monospace">${row.active}</td><td class="text-end font-monospace">${duration(row.elapsed_seconds)}</td></tr>`).join("")}</tbody></table></div>`;
}
function instances(data) {
  const filters = [["all", "全部"], ["attention", "需要关注"], ["busy", "操作中"], ["healthy", "健康"], ["disabled", "已停用"], ["temporary", "临时实例"]];
  const rows = data.accounts.filter((account) => matchFilter(account, data));
  return `
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div class="btn-group btn-group-sm" role="group">${filters.map(([id, label]) => `<button type="button" class="btn btn-outline-secondary${state.filter === id ? " is-on" : ""}" data-filter="${id}">${label}</button>`).join("")}</div>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <label class="d-flex align-items-center gap-2 mb-0">数量
          <input id="temp-count" class="form-control form-control-sm" type="number" min="1" max="100" step="1" value="${state.tempCount || "1"}" style="width: 4.5rem" aria-label="临时实例数量">
        </label>
        <div class="btn-group btn-group-sm">
          <button type="button" class="btn btn-primary" data-act="add-temp">添加临时实例</button>
          <button type="button" class="btn btn-outline-danger" data-act="remove-temp">批量移除</button>
          <button type="button" class="btn btn-outline-secondary" data-act="refresh">刷新数据</button>
        </div>
      </div>
    </div>
    <div class="sheet table-responsive"><table class="table table-sm table-hover align-middle mb-0 instance-table data-table">
      <thead><tr><th></th><th>实例</th><th>进程</th><th>启停</th><th>状态</th><th>IPv4 出口</th><th>IPv6 出口</th><th>位置</th><th>后端池</th><th class="text-end">活跃连接</th><th class="text-end" title="当前黏性用户名映射数；实例成功重连后清零">黏性用户数</th><th class="text-end">重启统计（用户 / 连接）</th><th class="text-end">在线时长</th><th class="text-end col-tight">最近操作</th><th class="col-tight"></th></tr></thead>
      <tbody>${rows.map((account) => `<tr class="${["down", "attention", "retrying"].includes(account.health) ? "row-alert" : ""}">
        <td>${account.temporary ? `<input class="form-check-input" type="checkbox" data-temp="${account.id}" ${state.temps.includes(String(account.id)) ? "checked" : ""} aria-label="选择 ${account.id}">` : ""}</td>
        <td class="font-monospace">${account.id}</td>
        <td class="${account.tunnel ? "" : "text-body-secondary"}">${account.health === "connecting" ? "启动中" : (account.health === "retrying" ? "重试中" : (account.tunnel ? "运行" : "停止"))}</td>
        <td class="${account.manual ? "" : "text-body-secondary"}">${account.manual ? "启用" : "停用"}</td>
        <td><span class="status-cell"><span class="lamp ${account.health}"></span><span>${healthText(account.health)}</span>${account.warp ? '<span class="probe">' + escapeHtml(account.warp) + '</span>' : ""}</span></td>
                ${egressCell(account.ipv4, interfaceV4(account))}
        ${egressCell(account.ipv6, interfaceV6(account))}
        <td>${escapeHtml(placeText(account))}</td>
        <td class="${account.pooled ? "" : "text-body-secondary"}">${account.pooled ? "已入池" : "未入池"}</td>
        <td class="text-end font-monospace">${account.active}</td>
        <td class="text-end font-monospace">${account.users}</td>
        <td class="text-end font-monospace">${account.restart_users} / ${account.restart_connections}</td>
        <td class="text-end font-monospace">${duration(account.uptime_seconds)}</td>
        <td class="text-end">${rowStatus(account)}</td>
        <td class="text-nowrap row-actions col-tight"><button type="button" class="btn btn-outline-secondary btn-sm" data-act="restart" data-slot="${account.id}" title="手动强制重连，不等待排空">强制重连</button> <button type="button" class="btn btn-outline-secondary btn-sm" data-act="manual" data-slot="${account.id}" data-on="${account.manual ? "0" : "1"}">${account.manual ? "停用" : "启用"}</button></td>
      </tr>`).join("") || `<tr><td colspan="15" class="text-body-secondary">没有符合筛选的实例</td></tr>`}</tbody>
    </table></div>`;
}
function connections() {
  const rows = state.sessions;
  if (!rows.length) return `<div class="card"><div class="card-body"><h2 class="h5">最近连接</h2><p class="text-body-secondary mb-0">暂无连接记录。这里最多保留最近 300 条连接，包括已关闭的连接。</p></div></div>`;
  return `<div class="card"><div class="card-body">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2"><h2 class="h5 mb-0">最近连接</h2><span class="text-body-secondary small">${rows.length} 条 · 最新在前 · 最多 300 条</span></div>
    <div class="sheet table-responsive connections-scroll mt-3"><table class="table table-sm table-hover align-middle mb-0 data-table"><thead><tr><th>请求</th><th>活跃状态</th><th>协议</th><th>客户端</th><th>用户</th><th>目标</th><th>出口</th><th>地址族</th><th>后端</th><th class="text-end">已持续</th><th class="text-end">空闲</th><th class="text-end">上行</th><th class="text-end">下行</th></tr></thead><tbody>${rows.map((row) => `<tr data-session="${row.id}"><td class="font-monospace">${row.id}</td><td><span class="status-cell"><span class="lamp ${row.active ? "on" : ""}"></span>${row.active ? "活跃" : "已关闭"}</span></td><td>${escapeHtml(row.protocol)}</td><td class="font-monospace">${escapeHtml(row.client)}</td><td>${escapeHtml(row.user)}</td><td class="font-monospace clip clip-wide" title="${escapeHtml(row.target)}">${escapeHtml(row.target)}</td><td class="font-monospace">${escapeHtml(row.egress || "—")}</td><td>${escapeHtml(row.family || "—")}</td><td class="font-monospace">${row.account}</td><td class="text-end font-monospace">${duration(Math.floor(row.age_ms / 1000))}</td><td class="text-end font-monospace">${duration(Math.floor(row.idle_ms / 1000))}</td><td class="text-end font-monospace">${bytes(row.up)}</td><td class="text-end font-monospace">${bytes(row.down)}</td></tr>`).join("")}</tbody></table></div>
  </div></div>`;
}
function paintLog(text) {
  return escapeHtml(text)
    .replace(/^\[([^\]]+)\]/, '<span class="tag">[$1]</span>')
    .replace(/↗/g, '<span class="ok">↗</span>')
    .replace(/×/g, '<span class="bad">×</span>')
    .replace(/ \| /g, ' <span class="sep">|</span> ');
}
function logs() {
  const page = state.logs || { lines: [], ready: 0, attention: 0, maintenance: 0, unknown: 0 };
  const kinds = [["all", "全部"], ["access", "访问"], ["plan", "计划"], ["account", "账号"]];
  const lines = page.lines.filter((line) => state.logKind === "all" || line.kind === state.logKind);
  return `<div class="card"><div class="card-body">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
      <h2 class="h5 mb-0">控制台日志</h2>
      <div class="d-flex align-items-center gap-2"><span class="text-body-secondary small">${lines.length}/${page.lines.length}</span><button type="button" class="btn btn-outline-secondary btn-sm" data-act="bottom">回到底部</button><button type="button" class="btn btn-outline-secondary btn-sm" data-act="copy">复制日志</button></div>
    </div>
    <p class="text-body-secondary mt-2 mb-2">就绪 ${page.ready} · 异常 ${page.attention} · 维护 ${page.maintenance} · 未知 ${page.unknown}</p>
    <div class="btn-group btn-group-sm mb-2">${kinds.map(([id, label]) => `<button type="button" class="btn btn-outline-secondary${state.logKind === id ? " is-on" : ""}" data-log="${id}">${label}</button>`).join("")}</div>
    <pre class="log">${lines.map((line) => '<span class="t">' + escapeHtml(clock(line.at)) + '</span>  ' + paintLog(line.text)).join("\n") || "还没有日志"}</pre>
  </div></div>`;
}
function bind() {
  document.querySelectorAll("[data-filter]").forEach((button) => button.addEventListener("click", () => { state.filter = button.dataset.filter; render(); }));
  document.querySelectorAll("[data-log]").forEach((button) => button.addEventListener("click", () => { state.logKind = button.dataset.log; render(); }));
  for (const id of ["restart-uptime", "restart-users", "restart-connections"]) {
    const field = document.getElementById(id);
    if (field) field.addEventListener("input", () => {
      state.restartDraft = {
        uptime: document.getElementById("restart-uptime").value,
        users: document.getElementById("restart-users").value,
        connections: document.getElementById("restart-connections").value,
      };
    });
  }
  document.querySelectorAll("[data-act]").forEach((button) => button.addEventListener("click", () => act(button.dataset.act, button)));
  if (state.busy) setBusy(true);
  applyFeedback();
  const box = document.querySelector("#logs pre");
  if (box) box.addEventListener("scroll", () => { state.stick = box.scrollHeight - box.scrollTop - box.clientHeight < 40; });
}
async function act(name, button) {
  if (name === "refresh") return refresh();
  if (name === "bottom") {
    const box = document.querySelector("#logs pre");
    if (box) box.scrollTop = box.scrollHeight;
    state.stick = true;
    return;
  }
  if (name === "copy") {
    const box = document.querySelector("#logs pre");
    if (box) await copyText(box.textContent);
    state.feedback = { key: "act:copy", text: "已复制", error: false };
    applyFeedback();
    scheduleFeedbackClear();
    return;
  }
  if (state.busy) return;
  if (name === "graceful-restart" && !window.confirm("全部实例将停止接入新连接，已有连接结束后按队列重启。排空期间可能无法建立新连接，确定继续吗？")) return;
  clearTimeout(feedbackTimer);
  const pickedTemps = [...document.querySelectorAll("[data-temp]:checked")].map((item) => item.dataset.temp);
  const tempCount = document.querySelector("#temp-count");
  if (tempCount) state.tempCount = tempCount.value;
  const text = name === "restart" ? "重连" : name === "manual" ? (button.dataset.on === "1" ? "启用" : "停用") : actionText(name, button);
  const key = feedbackKey(name, button);
  state.busy = true;
  state.feedback = { key: key, text: "正在" + text + "…", error: false };
  showError("");
  render();
  try {
    let successText = text + "完成";
    if (name === "toggle") await api("/api/toggle?on=" + button.dataset.on);
    if (name === "http2") await api("/api/http2?on=" + button.dataset.on);
    if (name === "interval") await api("/api/interval?seconds=" + (document.querySelector("#rotate-seconds").value || "0"));
    if (name === "rotate") await api("/api/rotate?slot=0");
    if (name === "trace") await api("/api/trace?slot=0");
    if (name === "graceful-restart") {
      const result = await api("/api/restart-graceful");
      successText = result.queued ? "已提交 " + result.queued + " 个实例" : "没有新增排空任务";
    }
    if (name === "restart-policy") {
      const uptime = document.getElementById("restart-uptime").value;
      const users = document.getElementById("restart-users").value;
      const connections = document.getElementById("restart-connections").value;
      if (![uptime, users, connections].every((value) => /^[0-9]+$/.test(value))) throw new Error("阈值必须是非负整数，0 表示关闭");
      await api("/api/restart-policy?max_uptime_seconds=" + uptime + "&max_users=" + users + "&max_connections=" + connections);
      state.restartDraft = null;
    }
    if (name === "add-temp") {
      const count = Math.max(1, Math.min(100, Number(state.tempCount) || 1));
      state.tempCount = String(count);
      await api("/api/account/add?temporary=1&count=" + count);
    }
    if (name === "remove-temp") {
      for (const slot of pickedTemps) state.status = await api("/api/account/remove?slot=" + slot);
      state.temps = [];
      document.querySelectorAll("[data-temp]").forEach((item) => { item.checked = false; });
      refreshSeq += 1;
      render();
    }
    if (name === "restart") await api("/api/restart?slot=" + button.dataset.slot);
    if (name === "manual") await api("/api/account/manual?slot=" + button.dataset.slot + "&on=" + button.dataset.on);
    state.feedback = { key: key, text: successText, error: false };
    await refresh();
  } catch (err) {
    const message = String(err.message || err);
    state.feedback = { key: key, text: message, error: true };
    showError(message);
    render();
  } finally {
    setBusy(false);
    scheduleFeedbackClear();
  }
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
}
function matchFilter(account, data) {
  const busy = (data.tasks || []).some((task) => task.id === account.id) || account.draining;
  if (state.filter === "attention") return account.health === "attention" || account.health === "down" || account.health === "unknown" || account.health === "connecting" || account.health === "retrying";
  if (state.filter === "busy") return busy;
  if (state.filter === "healthy") return account.health === "healthy";
  if (state.filter === "disabled") return !account.manual;
  if (state.filter === "temporary") return account.temporary;
  return true;
}
function healthText(health) {
  return { healthy: "健康", attention: "需关注", down: "中断", connecting: "连接中", retrying: "失败重试", maintenance: "维护", disabled: "已停用", unknown: "未知" }[health] || health;
}
function clock(ms, withDate) {
  if (!ms) return "—";
  const date = new Date(ms);
  const pad = (n) => String(n).padStart(2, "0");
  const time = pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
  if (!withDate) return time;
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + " " + time;
}
function duration(seconds) {
  seconds = Math.max(0, seconds | 0);
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const rest = seconds % 60;
  if (hours) return hours + " 小时 " + minutes + " 分";
  if (minutes) return minutes + " 分 " + rest + " 秒";
  return rest + " 秒";
}
function bytes(value) {
  const units = ["B", "KB", "MB", "GB"];
  let size = Number(value) || 0;
  let index = 0;
  while (size >= 1024 && index < units.length - 1) { size /= 1024; index += 1; }
  return (index ? size.toFixed(1) : size.toFixed(0)) + " " + units[index];
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
}
refresh();
</script>
</body>
