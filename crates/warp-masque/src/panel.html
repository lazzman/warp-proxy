<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>warp-proxy</title>
<link rel="stylesheet" href="/assets/bootstrap.min.css">
<style>
  :root, [data-bs-theme="light"] {
    --paper: #f3f4f2;
    --panel: #ffffff;
    --hair: rgba(24, 26, 23, .14);
    --ink: #1a1c19;
    --accent: #1d3c31;
    --alert-wash: #fbf7f2;
    --pill-bg: rgba(24, 26, 23, .06);
    --copy-hover: rgba(29, 60, 49, .08);
  }
  [data-bs-theme="dark"] {
    --paper: #111210;
    --panel: #181a17;
    --hair: rgba(236, 237, 230, .16);
    --ink: #eceee8;
    --accent: #e7ebe4;
    --alert-wash: #241f18;
    --pill-bg: rgba(236, 237, 230, .09);
    --copy-hover: rgba(231, 235, 228, .1);
  }
  body { background: var(--paper); color: var(--ink); font-weight: 400; }
  .navbar { min-height: 52px; background: var(--panel) !important; border-bottom-color: var(--hair) !important; }
  .navbar-brand { font-weight: 600; letter-spacing: -.01em; }
  #views .nav-link { border-radius: 8px; color: var(--bs-secondary-color); padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; }
  #views .nav-link.active { color: var(--ink); background: var(--bs-tertiary-bg); font-weight: 500; }
  .nav-pill { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--pill-bg); color: var(--bs-secondary-color); font-variant-numeric: tabular-nums; }
  .nav-pill.warn { background: rgba(184, 106, 26, .16); color: #b86a1a; }
  [data-bs-theme="dark"] .nav-pill.warn { color: #f0a85c; }
  #online { font-size: 13px; color: var(--bs-secondary-color); }
  main.container-fluid { padding: 24px 28px 48px; }
  .lamp { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--bs-secondary-color); flex: none; }
  .lamp.on, .lamp.healthy { background: #2f7d57; }
  .lamp.attention, .lamp.waiting, .lamp.down, .lamp.connecting, .lamp.retrying { background: #b86a1a; }
  .lamp.maintenance, .lamp.disabled { background: #a3453c; }
  .btn, .form-control, .form-select { border-radius: 8px; }
  .form-control, .form-select { border-color: var(--hair); }
  .btn { font-weight: 500; }
  .btn-sm { padding: 4px 10px; }
  .btn-xs { padding: 1px 6px; font-size: 11px; border-radius: 6px; }
  .btn-primary {
    --bs-btn-bg: var(--accent);
    --bs-btn-border-color: var(--accent);
    --bs-btn-hover-bg: #163028;
    --bs-btn-hover-border-color: #163028;
    --bs-btn-active-bg: #12261f;
    --bs-btn-active-border-color: #12261f;
    --bs-btn-color: #f4f6f2;
    --bs-btn-hover-color: #f4f6f2;
    --bs-btn-active-color: #f4f6f2;
  }
  [data-bs-theme="dark"] .btn-primary {
    --bs-btn-bg: #e7ebe4;
    --bs-btn-border-color: #e7ebe4;
    --bs-btn-color: #161815;
    --bs-btn-hover-bg: #f4f6f2;
    --bs-btn-hover-border-color: #f4f6f2;
    --bs-btn-hover-color: #161815;
    --bs-btn-active-bg: #d5dbd2;
    --bs-btn-active-border-color: #d5dbd2;
    --bs-btn-active-color: #161815;
  }
  .btn-outline-secondary {
    --bs-btn-color: var(--ink);
    --bs-btn-border-color: var(--hair);
    --bs-btn-hover-bg: var(--bs-tertiary-bg);
    --bs-btn-hover-color: var(--ink);
    --bs-btn-hover-border-color: var(--hair);
    --bs-btn-active-bg: var(--bs-tertiary-bg);
    --bs-btn-active-color: var(--ink);
    --bs-btn-active-border-color: var(--hair);
  }
  .btn-outline-danger {
    --bs-btn-color: #8a3b32;
    --bs-btn-border-color: #e4d2ce;
    --bs-btn-hover-bg: #f8f1ef;
    --bs-btn-hover-color: #8a3b32;
    --bs-btn-hover-border-color: #e4d2ce;
  }
  [data-bs-theme="dark"] .btn-outline-danger {
    --bs-btn-color: #e7b2aa;
    --bs-btn-border-color: #5a3330;
    --bs-btn-hover-bg: #2a1c1a;
    --bs-btn-hover-color: #e7b2aa;
    --bs-btn-hover-border-color: #5a3330;
  }
  .btn.is-on { background: #1c1e1b; color: #f4f5f2; border-color: #1c1e1b; }
  [data-bs-theme="dark"] .btn.is-on { background: #ecece6; color: #171816; border-color: #ecece6; }
  .card { border-radius: 12px; border-color: var(--hair); background: var(--panel); box-shadow: none; }
  .card-body { padding: 20px; }
  .card h2 { font-size: 15px; font-weight: 600; }
  #overview > h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  #overview > p { font-size: 13px; margin-bottom: 16px; }
  .stat .card-body { padding: 16px 18px 14px; }
  .stat .fs-3 { font-size: 28px; line-height: 1.15; letter-spacing: -.03em; margin: 6px 0 4px; }
  .figure, .num, .v { font-variant-numeric: tabular-nums; font-weight: 500; }
  .cluster { display: flex; flex-direction: column; gap: 8px; min-width: min(100%, 280px); padding: 12px 14px; border: 1px solid var(--hair); border-radius: 10px; background: var(--paper); }
  .cluster-label { font-size: 12px; color: var(--bs-secondary-color); }
  .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; }
  .metric { padding: 0 20px 0 0; }
  .metric + .metric { padding-left: 20px; border-left: 1px solid var(--hair); }
  .metric .k, .metric .s { font-size: 12px; color: var(--bs-secondary-color); }
  .metric .v { font-size: 18px; line-height: 1.4; margin-top: 4px; overflow-wrap: anywhere; }
  .metric .s { margin-top: 4px; }
  .sheet { border: 1px solid var(--hair); border-radius: 12px; background: var(--panel); overflow: auto; }
  .connections-scroll, .instance-scroll { max-height: 38rem; }
  .connections-scroll thead th, .instance-scroll thead th { position: sticky; top: 0; z-index: 1; }
  .data-table { font-size: 13px; }
  .data-table th { font-size: 12px; font-weight: 500; color: var(--bs-secondary-color); }
  .data-table td, .data-table th { padding: 8px 10px; border-color: var(--hair); }
  .data-table thead th { background: var(--paper); }
  .table-hover > tbody > tr:hover > * { background: rgba(24, 26, 23, .03); }
  [data-bs-theme="dark"] .table-hover > tbody > tr:hover > * { background: rgba(236, 237, 230, .04); }
  .instance-table th, .instance-table td { white-space: nowrap; vertical-align: middle; }
  .instance-table th { text-align: start; }
  .instance-table .col-tight { width: 1%; }
  .instance-table .font-monospace, .data-table .font-monospace { font-size: 12px; }
  tr.row-alert td { background: var(--alert-wash); }
  .table-hover > tbody > tr.row-alert:hover > * { background: #f6f0e8; }
  [data-bs-theme="dark"] .table-hover > tbody > tr.row-alert:hover > * { background: #2c261e; }
  tr.row-focus td { outline: 1px solid #2f7d57; }
  .status-cell { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
  .probe { color: var(--bs-secondary-color); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; padding: 1px 5px; border-radius: 4px; background: var(--pill-bg); }
  .tag-pill { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 999px; font-size: 11px; font-weight: 500; background: var(--pill-bg); color: var(--bs-secondary-color); }
  .tag-pill.drain { background: rgba(184, 106, 26, .15); color: #b86a1a; }
  .tag-pill.queue { background: rgba(47, 125, 87, .15); color: #2f7d57; }
  .tag-pill.dirty { background: rgba(184, 106, 26, .16); color: #b86a1a; }
  [data-bs-theme="dark"] .tag-pill.drain, [data-bs-theme="dark"] .tag-pill.dirty { color: #f0a85c; }
  [data-bs-theme="dark"] .tag-pill.queue { color: #7cd4a6; }
  .slot-jump { cursor: pointer; text-decoration: none; border: 1px solid var(--hair); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 1px 7px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; display: inline-block; margin: 2px 3px 2px 0; }
  .slot-jump:hover { background: var(--copy-hover); }
  .copyable { cursor: pointer; border-radius: 4px; transition: background-color .12s ease; }
  .copyable:hover { background: var(--copy-hover); }
  .clip { max-width: 168px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip-wide { max-width: 220px; }
  .row-actions .btn { padding: 2px 8px; }
  .policy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .policy-box { padding: 10px 12px; border: 1px solid var(--hair); border-radius: 10px; background: var(--paper); display: flex; flex-direction: column; gap: 6px; }
  .policy-box .hint { font-size: 11.5px; color: var(--bs-secondary-color); font-variant-numeric: tabular-nums; }
  .rule-details { font-size: 12.5px; color: var(--bs-secondary-color); border-top: 1px solid var(--hair); padding-top: 10px; }
  .rule-details summary { cursor: pointer; user-select: none; font-weight: 500; }
  .log {
    max-height: 36rem;
    margin: 0;
    padding: 16px 18px;
    border: 0;
    border-radius: 12px;
    background: #121411;
    color: #d7d8d4;
    font-size: 12.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .log .t { color: #8d8f89; }
  .log .tag { color: #c8c9c3; }
  .log .sep { color: #6e706a; }
  .log .ok { color: #8fbf9f; }
  .log .bad { color: #d7a08a; }
  .log mark { background: rgba(240, 168, 92, .32); color: #fff; padding: 0 2px; border-radius: 3px; }
  :focus-visible { outline: 2px solid #2f7d57; outline-offset: 2px; }
  #token { width: 150px; }
  @media (max-width: 768px) {
    main.container-fluid { padding: 16px 16px 32px; }
    .metrics { grid-template-columns: 1fr; gap: 12px; }
    .metric + .metric { padding-left: 0; border-left: 0; padding-top: 12px; border-top: 1px solid var(--hair); }
  }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
  <div class="container-fluid gap-3">
    <span class="navbar-brand mb-0 h1 fs-6 d-inline-flex align-items-center gap-2"><i class="lamp" id="lamp"></i>warp-proxy</span>
    <ul class="nav flex-row flex-nowrap" id="views">
      <li class="nav-item"><button type="button" class="nav-link active" data-view="overview"><span>总览</span><span class="nav-pill d-none" id="badge-overview"></span></button></li>
      <li class="nav-item"><button type="button" class="nav-link" data-view="instances"><span>实例</span><span class="nav-pill d-none" id="badge-instances"></span></button></li>
      <li class="nav-item"><button type="button" class="nav-link" data-view="connections"><span>连接</span><span class="nav-pill d-none" id="badge-connections"></span></button></li>
      <li class="nav-item"><button type="button" class="nav-link" data-view="logs"><span>日志</span><span class="nav-pill d-none" id="badge-logs"></span></button></li>
    </ul>
    <div class="ms-lg-auto d-flex flex-wrap align-items-center gap-2">
      <form class="d-flex align-items-center gap-2" id="login">
        <input id="token" class="form-control form-control-sm" type="password" placeholder="管理密码" autocomplete="current-password" aria-label="管理密码">
        <button class="btn btn-primary btn-sm" type="submit" id="login-submit">连接</button>
      </form>
      <button type="button" class="btn btn-outline-secondary btn-sm d-none" id="token-toggle" title="修改或清除管理密码">密码</button>
      <span id="online">控制面离线</span>
      <div class="btn-group btn-group-sm" role="group" aria-label="刷新与主题">
        <button type="button" class="btn btn-outline-secondary" id="top-refresh" title="立即刷新当前视图">刷新</button>
        <button type="button" class="btn btn-outline-secondary" id="theme-btn" title="切换颜色主题">主题: 自动</button>
      </div>
      <select id="refresh" class="form-select form-select-sm" style="width: 7.2rem" aria-label="自动刷新">
        <option value="0">暂停刷新</option>
        <option value="1">1 秒</option>
        <option value="3">3 秒</option>
        <option value="5" selected>5 秒</option>
        <option value="10">10 秒</option>
        <option value="30">30 秒</option>
      </select>
    </div>
  </div>
</nav>
<main class="container-fluid py-3">
  <div class="alert alert-danger d-none" id="error" role="alert"></div>
  <section id="overview">
    <h1 class="h4">还没有状态</h1>
    <p class="text-body-secondary mb-0">在顶栏输入管理密码并连接。连接后这里显示入口、流量和自动重启队列。</p>
  </section>
  <section id="instances" class="d-none"></section>
  <section id="connections" class="d-none"></section>
  <section id="logs" class="d-none"></section>
</main>
<script src="/assets/bootstrap.bundle.min.js"></script>
<script>
const FOCUSABLE_INPUTS = [
  "temp-count",
  "restart-uptime",
  "restart-users",
  "restart-connections",
  "restart-drain-timeout",
  "inst-query",
  "conn-query",
  "log-query"
];
const state = {
  view: "overview",
  filter: "all",
  instQuery: "",
  connFilter: "all",
  connQuery: "",
  connSort: "newest",
  logKind: "all",
  logQuery: "",
  logOnlyBad: false,
  status: null,
  sessions: [],
  logs: null,
  stick: true,
  timer: 0,
  temps: [],
  focusId: "",
  selectionRange: null,
  composing: false,
  restartDraft: null,
  rulesOpen: false,
  busy: false,
  busyKeys: new Set(),
  feedbackMap: {},
  copiedKey: "",
  highlightSlot: 0,
  pendingRender: false,
  scrollToSlot: 0,
  suppressLogScroll: false,
  logScrollTimer: 0,
  tempCount: "1",
  authCollapsed: false,
  authLockedOpen: false,
  lastUpdatedAt: 0,
  themeMode: "auto"
};
const tokenInput = document.querySelector("#token");
const loginForm = document.querySelector("#login");
const tokenToggleBtn = document.querySelector("#token-toggle");

function readCachedToken() {
  try {
    const saved = localStorage.getItem("warp-token");
    if (saved) return saved;
    const legacy = sessionStorage.getItem("warp-token") || "";
    if (legacy) localStorage.setItem("warp-token", legacy);
    return legacy;
  } catch (_) {
    return "";
  }
}
function writeCachedToken(token) {
  try {
    if (token) localStorage.setItem("warp-token", token);
    else localStorage.removeItem("warp-token");
    sessionStorage.removeItem("warp-token");
  } catch (_) {}
}
state.token = readCachedToken().trim();
tokenInput.value = state.token;

function readThemeMode() {
  try {
    return localStorage.getItem("warp-theme") || "auto";
  } catch (_) {
    return "auto";
  }
}
function applyTheme() {
  const mode = state.themeMode;
  const dark = mode === "dark" || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
  const btn = document.querySelector("#theme-btn");
  if (btn) {
    const label = mode === "auto" ? "自动" : mode === "dark" ? "深色" : "浅色";
    btn.textContent = "主题: " + label;
  }
}
state.themeMode = readThemeMode();
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
document.querySelector("#theme-btn").addEventListener("click", () => {
  const order = ["auto", "light", "dark"];
  state.themeMode = order[(order.indexOf(state.themeMode) + 1) % order.length];
  try { localStorage.setItem("warp-theme", state.themeMode); } catch (_) {}
  applyTheme();
});

function syncAuthBar(connected) {
  if (connected && state.token && !state.authCollapsed && !state.authLockedOpen && document.activeElement !== tokenInput) {
    state.authCollapsed = true;
  }
  if (!connected) {
    state.authCollapsed = false;
    state.authLockedOpen = false;
  }
  loginForm.classList.toggle("d-none", state.authCollapsed);
  tokenToggleBtn.classList.toggle("d-none", !state.authCollapsed);
}
tokenToggleBtn.addEventListener("click", () => {
  state.authLockedOpen = true;
  state.authCollapsed = false;
  loginForm.classList.remove("d-none");
  tokenToggleBtn.classList.add("d-none");
  tokenInput.focus();
  tokenInput.select();
});

function switchView(viewName) {
  state.view = viewName;
  document.querySelectorAll("#views button").forEach((item) => item.classList.toggle("active", item.dataset.view === viewName));
  for (const id of ["overview", "instances", "connections", "logs"]) {
    document.querySelector("#" + id).classList.toggle("d-none", id !== state.view);
  }
  refresh(true);
}
document.querySelectorAll("#views button").forEach((button) => {
  button.addEventListener("click", () => switchView(button.dataset.view));
});
loginForm.addEventListener("submit", (event) => {
  event.preventDefault();
  state.token = tokenInput.value.trim();
  state.authCollapsed = true;
  state.authLockedOpen = false;
  if (!state.token) writeCachedToken("");
  refresh(true);
});
document.querySelector("#refresh").addEventListener("change", schedule);
document.querySelector("#top-refresh").addEventListener("click", () => refresh(true));

document.addEventListener("compositionstart", () => { state.composing = true; });
document.addEventListener("compositionend", () => {
  state.composing = false;
  flushPendingRender();
});
document.addEventListener("selectionchange", () => {
  flushPendingRender();
});

function hasUserSelection() {
  const sel = window.getSelection ? window.getSelection() : null;
  if (!sel || sel.isCollapsed) return false;
  const text = String(sel.toString() || "").trim();
  return text.length > 0;
}
function flushPendingRender() {
  if (!state.pendingRender || state.composing || hasUserSelection()) return;
  state.pendingRender = false;
  render();
}
function scheduleRender() {
  if (state.composing || hasUserSelection()) {
    state.pendingRender = true;
    return;
  }
  state.pendingRender = false;
  render();
}
function requestRender() {
  if (state.composing) {
    state.pendingRender = true;
    return;
  }
  state.pendingRender = false;
  render();
}

function schedule() {
  clearTimeout(state.timer);
  let seconds = Number(document.querySelector("#refresh").value);
  if (seconds <= 0) return;
  if (state.status && state.status.tasks && state.status.tasks.length) seconds = Math.min(seconds, 1);
  state.timer = setTimeout(refresh, seconds * 1000);
}
async function api(path) {
  const token = (state.token || "").trim();
  const response = await fetch(path, { headers: token ? { "X-Warp-Token": token } : {}, cache: "no-store" });
  const text = await response.text();
  if (!response.ok) throw new Error(text || response.statusText);
  return text ? JSON.parse(text) : {};
}
function showError(message) {
  const error = document.querySelector("#error");
  error.textContent = message || "";
  error.classList.toggle("d-none", !message);
}
function feedbackKey(name, button) {
  if (button && button.dataset.slot && (name === "restart" || name === "manual" || name === "graceful-slot" || name === "trace-slot")) {
    return "slot:" + button.dataset.slot;
  }
  return "act:" + name;
}
function setFeedback(key, text, error, ttlMs = 1600) {
  const prev = state.feedbackMap[key];
  if (prev && prev.timer) clearTimeout(prev.timer);
  const entry = { text, error: Boolean(error), timer: 0 };
  if (ttlMs > 0) {
    entry.timer = setTimeout(() => {
      delete state.feedbackMap[key];
      if (!state.busyKeys.has(key)) scheduleRender();
    }, ttlMs);
  }
  state.feedbackMap[key] = entry;
}
function rowStatus(account) {
  const live = state.feedbackMap["slot:" + account.id];
  if (!live) return escapeHtml(account.last_action || "—");
  const tone = live.error ? "text-danger fw-medium" : "text-primary fw-medium";
  return '<span class="' + tone + '" title="' + escapeHtml(live.text) + '">' + escapeHtml(live.text) + "</span>";
}
const buttonLabels = new WeakMap();
const buttonTitles = new WeakMap();
const buttonDisabled = new WeakMap();
function applyFeedback() {
  document.querySelectorAll("[data-act]").forEach((button) => {
    const key = feedbackKey(button.dataset.act, button);
    if (!buttonLabels.has(button)) {
      buttonLabels.set(button, button.textContent);
      buttonTitles.set(button, button.getAttribute("title") || "");
      buttonDisabled.set(button, button.disabled);
    }
    const live = key.indexOf("act:") === 0 ? state.feedbackMap[key] : null;
    const originalTitle = buttonTitles.get(button);
    if (live) {
      button.textContent = live.error ? "失败" : live.text;
      button.setAttribute("title", live.text);
    } else {
      button.textContent = buttonLabels.get(button);
      if (originalTitle) button.setAttribute("title", originalTitle);
      else button.removeAttribute("title");
    }
    button.disabled = buttonDisabled.get(button) || state.busyKeys.has(key);
  });
}
function actionText(name, button) {
  const slot = button && button.dataset.slot;
  if (name === "restart") return slot ? "强制重连实例 " + slot : "强制重连";
  if (name === "graceful-slot") return slot ? "排空重连实例 " + slot : "排空重连";
  if (name === "trace-slot") return slot ? "探测实例 " + slot + " 出口" : "探测出口";
  if (name === "manual") return (button.dataset.on === "1" ? "启用" : "停用") + (slot ? "实例 " + slot : "");
  if (name === "trace") return "检测出口 IP";
  if (name === "graceful-restart") return "触发全部实例优雅重启";
  if (name === "restart-policy") return "更新重启策略";
  if (name === "add-temp") {
    const count = Math.max(1, Math.min(100, Number(state.tempCount) || 1));
    return count > 1 ? "添加 " + count + " 个临时实例" : "添加临时实例";
  }
  if (name === "remove-temp") return "移除临时实例";
  if (name === "toggle") return button.dataset.on === "1" ? "恢复入口" : "暂停入口";

let refreshSeq = 0;
async function refresh(forceRender = false) {
  const seq = ++refreshSeq;
  try {
    const status = await api("/api/status");
    if (seq !== refreshSeq) return;
    state.status = status;
    if (state.view === "connections") {
      const page = await api("/api/sessions");
      if (seq !== refreshSeq) return;
      state.sessions = page.sessions || page || [];
    }
    if (state.view === "logs") {
      const logs = await api("/api/logs");
      if (seq !== refreshSeq) return;
      state.logs = logs;
    }
    state.lastUpdatedAt = Date.now();
    writeCachedToken(state.token);
    showError("");
    syncAuthBar(true);
    updateNavBadges();
    const online = document.querySelector("#online");
    const paused = Number(document.querySelector("#refresh").value) <= 0;
    const baseText = status.initializing ? "正在准备账号" : "控制面在线";
    online.textContent = baseText + " · " + clock(state.lastUpdatedAt) + (paused ? " (已暂停)" : "");
    document.querySelector("#lamp").className = "lamp on";
    if (state.composing) {
      state.pendingRender = true;
    } else if (forceRender || !hasUserSelection()) {
      state.pendingRender = false;
      render();
    } else {
      state.pendingRender = true;
    }
  } catch (err) {
    if (seq !== refreshSeq) return;
    syncAuthBar(false);
    const online = document.querySelector("#online");
    online.textContent = "控制面离线";
    document.querySelector("#lamp").className = "lamp";
    showError(String(err.message || err).replace(/^Error: /, ""));
  }
  if (seq === refreshSeq) schedule();
}

function capture() {
  const boxes = [...document.querySelectorAll("[data-temp]")];
  const currentIds = boxes.map((box) => String(box.dataset.temp));
  const checkedIds = boxes.filter((box) => box.checked).map((box) => String(box.dataset.temp));
  const merged = new Set([
    ...state.temps.filter((id) => !currentIds.includes(String(id))),
    ...checkedIds,
  ]);
  state.temps = [...merged];
  if (state.status && state.status.accounts) {
    const validTemps = new Set(state.status.accounts.filter((account) => account.temporary).map((account) => String(account.id)));
    state.temps = state.temps.filter((id) => validTemps.has(String(id)));
  }
  const active = document.activeElement;
  const tempCount = document.getElementById("temp-count");
  if (tempCount) state.tempCount = tempCount.value;
  const rulesDetails = document.querySelector("#rules-details");
  if (rulesDetails) state.rulesOpen = rulesDetails.open;
  if (active && FOCUSABLE_INPUTS.includes(active.id)) {
    state.focusId = active.id;
    try {
      state.selectionRange = typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
    } catch (_) {
      state.selectionRange = null;
    }
  } else {
    state.focusId = "";
    state.selectionRange = null;
  }
}

function render() {
  const data = state.status;
  if (!data) return;
  capture();
  if (state.view === "overview") document.querySelector("#overview").innerHTML = overview(data);
  if (state.view === "instances") {
    const panel = document.querySelector("#instances");
    const prev = panel.querySelector(".instance-scroll");
    const top = prev ? prev.scrollTop : 0;
    const left = prev ? prev.scrollLeft : 0;
    panel.innerHTML = instances(data);
    const next = panel.querySelector(".instance-scroll");
    if (next) {
      next.scrollTop = top;
      next.scrollLeft = left;
      if (state.highlightSlot && state.scrollToSlot) {
        const targetRow = next.querySelector('tr[data-slot-row="' + state.highlightSlot + '"]');
        if (targetRow) targetRow.scrollIntoView({ block: "nearest" });
      }
    }
    state.scrollToSlot = 0;
  }
  if (state.view === "connections") {
    const panel = document.querySelector("#connections");
    const previous = panel.querySelector(".connections-scroll");
    const scrollTop = previous ? previous.scrollTop : 0;
    const scrollLeft = previous ? previous.scrollLeft : 0;
    const anchor = previous && scrollTop > 0 ? [...previous.querySelectorAll("tbody tr")].find((row) => row.getBoundingClientRect().bottom > previous.getBoundingClientRect().top) : null;
    const anchorId = anchor && anchor.dataset.session;
    const anchorOffset = anchor ? anchor.getBoundingClientRect().top - previous.getBoundingClientRect().top : 0;
    panel.innerHTML = connections();
    const next = panel.querySelector(".connections-scroll");
    if (next) {
      next.scrollTop = scrollTop;
      next.scrollLeft = scrollLeft;
      if (anchorId) {
        const row = [...next.querySelectorAll("tbody tr")].find((item) => item.dataset.session === anchorId);
        if (row) next.scrollTop += row.getBoundingClientRect().top - next.getBoundingClientRect().top - anchorOffset;
      }
    }
  }
  if (state.view === "logs") {
    const box = document.querySelector("#logs pre");
    const prevTop = box ? box.scrollTop : 0;
    document.querySelector("#logs").innerHTML = logs();
    const next = document.querySelector("#logs pre");
    if (next) {
      clearTimeout(state.logScrollTimer);
      state.suppressLogScroll = true;
      if (state.stick) {

  if (state.focusId) {
    const node = document.getElementById(state.focusId);
    if (node) {

        try { node.setSelectionRange(state.selectionRange[0], state.selectionRange[1]); } catch (_) {}
      }
    }
  }
  bind();
}

function connections() {

function isBadLogLine(line) {
  const t = (line && line.text) || "";
  return t.includes("×") || t.includes("失败") || t.includes("错误") || t.includes("拒绝") || t.includes("中断") || /error|fail/i.test(t);
}
function paintLog(text, query) {
  const expression = query ? new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi") : null;
  const parts = expression ? String(text).split(expression) : [String(text)];
  return parts.map((part, index) => {
    const html = escapeHtml(part)
      .replace(/^\[([^\]]+)\]/, '<span class="tag">[$1]</span>')
      .replace(/↗/g, '<span class="ok">↗</span>')
      .replace(/×/g, '<span class="bad">×</span>')
      .replace(/ \| /g, ' <span class="sep">|</span> ');
    return expression && index % 2 === 1 ? '<mark>' + html + '</mark>' : html;
  }).join("");
}

function bind() {
  document.querySelectorAll("[data-filter]").forEach((button) => button.addEventListener("click", () => {
    state.filter = button.dataset.filter;
    state.highlightSlot = 0;
    render();
  }));
  document.querySelectorAll("[data-conn-filter]").forEach((button) => button.addEventListener("click", () => {
    state.connFilter = button.dataset.connFilter;
    render();
  }));
  document.querySelectorAll("[data-log]").forEach((button) => button.addEventListener("click", () => {
    state.logKind = button.dataset.log;
    render();
  }));
  const badBtn = document.getElementById("log-only-bad");
  if (badBtn) badBtn.addEventListener("click", () => {
    state.logOnlyBad = !state.logOnlyBad;
    render();
  });
  const instQuery = document.getElementById("inst-query");
  if (instQuery) instQuery.addEventListener("input", () => {
    state.instQuery = instQuery.value;
    state.highlightSlot = 0;
    requestRender();
  });
  const connQuery = document.getElementById("conn-query");
  if (connQuery) connQuery.addEventListener("input", () => {
    state.connQuery = connQuery.value;
    requestRender();
  });
  const connSort = document.getElementById("conn-sort");
  if (connSort) connSort.addEventListener("change", () => {
    state.connSort = connSort.value;
    render();
  });
  const logQuery = document.getElementById("log-query");
  if (logQuery) logQuery.addEventListener("input", () => {
    state.logQuery = logQuery.value;
    requestRender();
  });

  const selectAllTemps = document.getElementById("select-all-temps");
  if (selectAllTemps) {
    const tempBoxes = [...document.querySelectorAll("[data-temp]")];
    const checkedCount = tempBoxes.filter((b) => b.checked).length;
    selectAllTemps.indeterminate = checkedCount > 0 && checkedCount < tempBoxes.length;
    selectAllTemps.addEventListener("change", () => {
      const checked = selectAllTemps.checked;
      tempBoxes.forEach((box) => { box.checked = checked; });
      const visibleIds = tempBoxes.map((b) => String(b.dataset.temp));
      if (checked) {
        const merged = new Set([...state.temps, ...visibleIds]);
        state.temps = [...merged];
      } else {
        state.temps = state.temps.filter((id) => !visibleIds.includes(id));
      }
      render();
    });
  }
  document.querySelectorAll("[data-temp]").forEach((box) => {
    box.addEventListener("change", () => {
      const id = String(box.dataset.temp);
      if (box.checked) {
        if (!state.temps.includes(id)) state.temps = [...state.temps, id];
      } else {
        state.temps = state.temps.filter((item) => item !== id);
      }
      render();
    });
  });

  for (const id of ["restart-uptime", "restart-users", "restart-connections", "restart-drain-timeout"]) {
    const field = document.getElementById(id);
    if (field) field.addEventListener("input", () => {
      state.restartDraft = {
        uptime: document.getElementById("restart-uptime").value,
        users: document.getElementById("restart-users").value,
        connections: document.getElementById("restart-connections").value,
        drainTimeout: document.getElementById("restart-drain-timeout").value,
      };
      requestRender();
    });
  }
  document.querySelectorAll("[data-preset]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const [fieldId, val] = btn.dataset.preset.split(":");
      const el = document.getElementById(fieldId);
      if (el) {
        el.value = val;
        state.restartDraft = {
          uptime: document.getElementById("restart-uptime").value,
          users: document.getElementById("restart-users").value,
          connections: document.getElementById("restart-connections").value,
          drainTimeout: document.getElementById("restart-drain-timeout").value,
        };
        render();
      }
    });
  });

  const rulesDetails = document.getElementById("rules-details");
  if (rulesDetails) {
    rulesDetails.addEventListener("toggle", () => {
      state.rulesOpen = rulesDetails.open;
    });
  }

  document.querySelectorAll("[data-jump-slot]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const slot = Number(btn.dataset.jumpSlot) || 0;
      state.filter = "all";
      state.instQuery = "";
      state.highlightSlot = slot;
      state.scrollToSlot = slot;
      switchView("instances");
    });
  });

  document.querySelectorAll("[data-copy]").forEach((node) => {
    node.addEventListener("click", async () => {
      const text = node.dataset.copy;
      const key = node.dataset.copyKey || "";
      if (!text) return;
      await copyText(text);
      state.copiedKey = key;
      render();
      setTimeout(() => {
        if (state.copiedKey === key) {
          state.copiedKey = "";
          scheduleRender();
        }
      }, 1200);
    });
  });

  document.querySelectorAll("[data-act]").forEach((button) => button.addEventListener("click", () => act(button.dataset.act, button)));
  applyFeedback();
  const box = document.querySelector("#logs pre");
  if (box) box.addEventListener("scroll", () => {
    if (state.suppressLogScroll) return;
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    if (state.stick !== nearBottom) {
      state.stick = nearBottom;
      const stickBtn = document.querySelector('[data-act="toggle-stick"]');
      if (stickBtn) {
        stickBtn.classList.toggle("is-on", state.stick);
        stickBtn.textContent = state.stick ? "自动滚底: 开" : "自动滚底: 暂停";
      }
    }
  });
}

async function act(name, button) {
  if (name === "refresh") return refresh(true);
  if (name === "reset-policy") {
    state.restartDraft = null;
    render();
    return;
  }
  if (name === "toggle-stick") {
    state.stick = !state.stick;
    if (state.stick) {
      const box = document.querySelector("#logs pre");
      if (box) box.scrollTop = box.scrollHeight;
    }
    render();
    return;
  }
  if (name === "bottom") {
    const box = document.querySelector("#logs pre");
    if (box) box.scrollTop = box.scrollHeight;
    state.stick = true;
    render();
    return;
  }
  if (name === "copy") {
    const box = document.querySelector("#logs pre");
    if (box) await copyText(box.textContent);
    setFeedback("act:copy", "已复制", false);
    applyFeedback();
    return;
  }

  const key = feedbackKey(name, button);
  if (state.busyKeys.has(key)) return;

  if (name === "graceful-restart" && !window.confirm("全部实例将停止接入新连接，已有连接结束后按队列重启。排空期间可能无法建立新连接，确定继续吗？")) return;
  const pickedTemps = [...new Set(state.temps)];
  if (name === "remove-temp") {
    if (!pickedTemps.length) return;
    if (pickedTemps.length > 1 && !window.confirm("确定要批量移除已勾选的 " + pickedTemps.length + " 个临时实例吗？")) return;
  }

  const tempCount = document.querySelector("#temp-count");
  if (tempCount) state.tempCount = tempCount.value;
  const text = name === "restart" ? "强制重连" : name === "graceful-slot" ? "优雅重连" : name === "trace-slot" ? "探测出口" : name === "manual" ? (button.dataset.on === "1" ? "启用" : "停用") : actionText(name, button);

  setKeyBusy(key, true);
  setFeedback(key, "正在" + text + "…", false, 0);
  showError("");
  render();
  try {
    let successText = text + "完成";
    if (name === "toggle") await api("/api/toggle?on=" + button.dataset.on);
    if (name === "http2") await api("/api/http2?on=" + button.dataset.on);
    if (name === "trace") await api("/api/trace?slot=0");
    if (name === "trace-slot") await api("/api/trace?slot=" + button.dataset.slot);
    if (name === "graceful-restart") {
      const result = await api("/api/restart-graceful");
      successText = result.queued ? "已提交 " + result.queued + " 个实例" : "没有新增排空任务";
    }
    if (name === "graceful-slot") {
      const result = await api("/api/restart-graceful?slot=" + button.dataset.slot);
      successText = result.queued ? "已进入排空队列" : "已在队列或无需排空";
    }
    if (name === "restart-policy") {
      const uptime = document.getElementById("restart-uptime").value;
      const users = document.getElementById("restart-users").value;
      const connections = document.getElementById("restart-connections").value;
      const drainTimeout = document.getElementById("restart-drain-timeout").value;
      if (![uptime, users, connections, drainTimeout].every((value) => /^[0-9]+$/.test(value))) throw new Error("阈值和排空上限必须是非负整数，0 表示关闭");
      await api("/api/restart-policy?max_uptime_seconds=" + uptime + "&max_users=" + users + "&max_connections=" + connections + "&drain_timeout_seconds=" + drainTimeout);
      state.restartDraft = null;
      successText = "策略已生效";
    }
    if (name === "add-temp") {
      const count = Math.max(1, Math.min(100, Number(state.tempCount) || 1));
      state.tempCount = String(count);
      await api("/api/account/add?temporary=1&count=" + count);
    }
    if (name === "remove-temp") {
      refreshSeq += 1;
      let done = 0;
      for (const slot of pickedTemps) {
        done += 1;
        setFeedback(key, "正在移除 (" + done + "/" + pickedTemps.length + ")…", false, 0);
        render();
        state.status = await api("/api/account/remove?slot=" + slot);
      }
      state.temps = [];
      document.querySelectorAll("[data-temp]").forEach((box) => { box.checked = false; });
      successText = "已移除 " + pickedTemps.length + " 个实例";
    }
    if (name === "restart") await api("/api/restart?slot=" + button.dataset.slot);
    if (name === "manual") await api("/api/account/manual?slot=" + button.dataset.slot + "&on=" + button.dataset.on);
    setKeyBusy(key, false);
    setFeedback(key, successText, false, 1600);
    await refresh(true);
  } catch (err) {
    const message = String(err.message || err);
    setKeyBusy(key, false);
    setFeedback(key, message, true, 3000);
    showError(message);
    render();
    schedule();
  }
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
}
function healthText(health) {
  return { healthy: "健康", attention: "需关注", down: "中断", connecting: "连接中", retrying: "失败重试", maintenance: "维护", disabled: "已停用", unknown: "未知" }[health] || health;
}
function clock(ms, withDate) {
  if (!ms) return "—";
  const date = new Date(ms);
  const pad = (n) => String(n).padStart(2, "0");
  const time = pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
  if (!withDate) return time;
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + " " + time;
}
function duration(seconds) {
  seconds = Math.max(0, seconds | 0);
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const rest = seconds % 60;
  if (hours) return hours + " 小时 " + minutes + " 分";
  if (minutes) return minutes + " 分 " + rest + " 秒";
  return rest + " 秒";
}
function bytes(value) {
  const units = ["B", "KB", "MB", "GB"];
  let size = Number(value) || 0;
  let index = 0;
  while (size >= 1024 && index < units.length - 1) { size /= 1024; index += 1; }
  return (index ? size.toFixed(1) : size.toFixed(0)) + " " + units[index];
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
}
refresh();
</script>
