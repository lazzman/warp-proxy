# 默认只发布到本机回环，避免代理和控制面板直接暴露到公网。
# 管理面板密码由 CONTROL_PASSWORD 决定，默认 admin。
services:
  warp-proxy:
    image: ghcr.io/lazzman/warp-proxy:latest
    build: .
    container_name: warp-proxy
    # 兼容 MicroWARP 持久化配置的文件权限；仅挂载可信的数据目录。
    user: "0:0"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:47100:47100"
    environment:
      INSTANCE_COUNT: "1"
      BIND_ADDR: "0.0.0.0"
      BIND_PORT: "1080"
      CONTROL_ADDR: "0.0.0.0"
      CONTROL_PORT: "47100"
      CONTROL_PASSWORD: "admin"
      STATE_DIR: /var/lib/warp-proxy
      # 可选：挂载到其他目录时，用 MICROWARP_DIR 指定 MicroWARP 的数据目录。
      # MICROWARP_DIR: /mnt/microwarp/instances
      # MICROWARP_SCAN_INTERVAL: 60s
      PROXY_MODE: mixed
      MASQUE_HTTP2: "0"
      RESOLVE_PREFERENCE: auto
      LB_STRATEGY: round
      LB_STICKY_MODE: username-round
      LB_ROTATE_INTERVAL: 5m
      LB_ACCESS_LOG: "0"
      # 需要上游时设置 UPSTREAM_SOCKS5，格式为 socks5://用户:密码@主机:端口。
      # 需要入口认证时同时设置 SOCKS_USER 和 SOCKS_PASS。
      # 三个重启阈值独立组合，任意达到就立即排空；0 关闭该条件。
      RESTART_MAX_UPTIME: "0"
      RESTART_MAX_USERS: "0"
      RESTART_MAX_CONNECTIONS: "0"
      # 排空超过 300 秒会断开剩余连接；0 表示不设超时。
      RESTART_DRAIN_CHECK_INTERVAL: 10s
      RESTART_DRAIN_TIMEOUT: 300s
      RESTART_PROBE_TIMEOUT: 90s
      RESTART_CONCURRENCY: "1"
      HEALTH_CHECK_INTERVAL: 60s
      HEALTH_CHECK_TIMEOUT: 20s
    volumes:
      - warp-proxy-state:/var/lib/warp-proxy
      # 将原 MicroWARP 的 instances 目录只读挂载后，启动及运行时自动迁移新增账号。
      # - /你的路径/lb-microwarp/instances:/var/lib/warp-proxy/instances:ro

volumes:
  warp-proxy-state:
