name: Docker

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Fill empty release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          CURRENT_BODY: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          trimmed="$(printf '%s' "${CURRENT_BODY:-}" | tr -d '[:space:]')"
          case "${CURRENT_BODY:-}" in
            *"Describe this release"*|"" ) fill=1 ;;
            *) fill=0 ;;
          esac
          if [ -z "$trimmed" ]; then
            fill=1
          fi
          if [ "$fill" != 1 ]; then
            echo "保留已有 Release 说明"
            exit 0
          fi
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]'):${TAG#v}"
          body="$(printf '%s\n' \
            '## warp-proxy' \
            '' \
            '单进程 Cloudflare WARP MASQUE 代理，带多账号调度、同端口 HTTP 代理和管理面板。' \
            '' \
            '```bash' \
            "docker pull ${image}" \
            '```' \
            '' \
            "详见 [README](https://github.com/${REPO}#readme)。")"
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" \
            -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'release' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
